name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install headless Chrome
        working-directory: .github/prerender
        run: npm install --no-audit --no-fund
      - name: Render pages to static HTML
        run: node .github/prerender/prerender.mjs
        env:
          # Publishable key: it is sent to every browser anyway, and access is
          # controlled by row-level security. Never put a secret key here.
          NEXT_PUBLIC_SUPABASE_URL: https://zmjntomnvwcnzaklodno.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Md8U0IfFBw5YgrG83q8F8A_MfRQ65ve
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
