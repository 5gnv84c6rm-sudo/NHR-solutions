<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Form components</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--nhr-light);font-family:var(--font-core)}.wrap{padding:22px 24px}.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.lbl{font-size:11px;font-family:var(--font-mono);color:var(--text-muted);margin:0 0 8px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
function Icon({name,size=24,strokeWidth=1.75,style}){const lib=(typeof lucide!=='undefined'&&lucide)||{};const node=lib[name]||(lib.icons&&lib.icons[name])||[];return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" style={{flex:'0 0 auto',...style}} aria-hidden="true">{(Array.isArray(node)?node:[]).map((c,i)=>React.createElement(c[0],{key:i,...c[1]}))}</svg>;}

const { Input, Select, Checkbox, Switch } = window.NHRSolutionDesignSystem_0db691;
function Demo(){const [a,setA]=React.useState(true);const [b,setB]=React.useState(false);
return (<div className="wrap" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18}}>
<div style={{display:'flex',flexDirection:'column',gap:14}}>
<Input label="Work email" type="email" placeholder="you@company.com" required iconLeft={<Icon name="Mail" size={16}/>}/>
<Input label="Employees" placeholder="0" error="Enter a number greater than zero"/>
<div className="row"><Checkbox label="Send product updates" checked={a} onChange={e=>setA(e.target.checked)}/><Switch label="Annual billing" checked={b} onChange={e=>setB(e.target.checked)}/></div>
</div>
<div style={{display:'flex',flexDirection:'column',gap:14,background:'var(--nhr-black)',padding:18,borderRadius:'var(--radius-card)'}}>
<Input tone="dark" label="Full name" placeholder="Amara Osei"/>
<Select tone="dark" label="Company size" options={['1–10','11–50','51–200','200+']}/>
<Checkbox tone="dark" label="I agree to the terms" checked/>
</div>
</div>);}

ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
