<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--nhr-white);font-family:var(--font-core)}.wrap{padding:22px 24px}.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.lbl{font-size:11px;font-family:var(--font-mono);color:var(--text-muted);margin:0 0 8px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
function Icon({name,size=24,strokeWidth=1.75,style}){const lib=(typeof lucide!=='undefined'&&lucide)||{};const node=lib[name]||(lib.icons&&lib.icons[name])||[];return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" style={{flex:'0 0 auto',...style}} aria-hidden="true">{(Array.isArray(node)?node:[]).map((c,i)=>React.createElement(c[0],{key:i,...c[1]}))}</svg>;}

const { SolutionCard, BenefitCard, PricingCard, TestimonialCard, StepCard, FaqItem } = window.NHRSolutionDesignSystem_0db691;
function Demo(){const [open,setOpen]=React.useState(0);
return (<div className="wrap" style={{display:'flex',flexDirection:'column',gap:18}}>
<div style={{display:'grid',gridTemplateColumns:'1.2fr 1fr 1fr',gap:14,alignItems:'stretch'}}>
<SolutionCard icon={<Icon name="Users"/>} title="HR &amp; Workforce" description="Manage employees, attendance, leave and documents from one platform."/>
<BenefitCard icon={<Icon name="Zap" size={20}/>} term="Smart" description="Technology designed to make everyday work easier."/>
<TestimonialCard quote="Everything our team needs now sits in one place." name="Amara Osei" role="Operations Director" company="Northline"/>
</div>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,alignItems:'stretch'}}>
<PricingCard name="Professional" featured price="£79" features={['Everything in Starter','Advanced analytics','Payroll tools']}/>
<div style={{display:'flex',flexDirection:'column',gap:16}}>
<StepCard number="01" title="Choose Your Solution" description="Select the tools that match your business needs."/>
<div><FaqItem id="q1" question="What is NHR Solution?" answer="A set of smart digital tools that help businesses manage everyday operations." open={open===0} onToggle={()=>setOpen(open===0?-1:0)}/>
<FaqItem id="q2" question="Do you offer a free trial?" answer="Trial availability is confirmed during onboarding." open={open===1} onToggle={()=>setOpen(open===1?-1:1)}/></div>
</div>
</div>
</div>);}

ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
