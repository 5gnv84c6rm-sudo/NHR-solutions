<!-- @dsCard group="Brand" viewport="700x210" name="Dot pattern" subtitle="Halftone field lifted from the logo artwork — hero, dark sections, CTA, footer" -->
<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-core)}.p{position:relative;height:170px;margin:20px 24px;border-radius:var(--radius-card);overflow:hidden;background:var(--nhr-black)}
.tl{position:absolute;inset:0;background:url(../assets/pattern-dots-tl.png) no-repeat top left/40% auto;mix-blend-mode:screen}
.br{position:absolute;inset:0;background:url(../assets/pattern-dots-br.png) no-repeat bottom right/40% auto;mix-blend-mode:screen}
.gl{position:absolute;width:300px;height:300px;left:32%;top:-120px;background:radial-gradient(circle,rgba(0,229,212,.22),transparent 62%)}
.t{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:22px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}</style>
<div class="p"><div class="tl"></div><div class="br"></div><div class="gl"></div><div class="t">Ready To <span style="color:var(--nhr-turquoise)">Work Smarter</span>?</div></div>
