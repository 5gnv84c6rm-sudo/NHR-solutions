<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:854px;width:1280px;overflow:hidden}
.page{display:flex;height:854px;width:1280px}
.main{flex:1;background:var(--nhr-black);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.dots{position:absolute;inset:0;background:url(assets/pattern-dots-tl.png) no-repeat top left/60% auto;mix-blend-mode:screen;opacity:.9}
.dots2{position:absolute;inset:0;background:url(assets/pattern-dots-br.png) no-repeat bottom right/55% auto;mix-blend-mode:screen;opacity:.7}
.logo{position:relative;width:640px}
.strip{width:320px;display:flex;flex-direction:column}
.strip span{flex:1}
</style></head><body>
<div class="page">
<div class="main"><div class="dots"></div><div class="dots2"></div><img class="logo" src="assets/logo-light.png" alt="NHR Solution"></div>
<div class="strip">
<span style="background:#D9FFFB"></span>
<span style="background:#3DF0E2"></span>
<span style="background:#00E5D4"></span>
<span style="background:#00BFB2"></span>
</div>
</div></body></html>
